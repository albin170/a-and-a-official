<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funny Sounds — A MUSIC</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav class="nav"><a class="logo" href="/">🎵 <span class="site-name">A MUSIC</span></a>
<div class="nav-links"><a href="/">Home</a><a href="/music.html">Library</a><a href="/player.html">Studio</a><a href="/effects.html" class="active">😂 Effects</a></div><span></span></nav>
<div class="wrap">
  <h2 class="section-title">😂 Funny Noise Board</h2>
  <p style="color:var(--muted)">Tap any sound — it plays instantly (synthesized live, no files needed). Use them inside the Studio's Chaos Mode too.</p>
  <div class="fx-board" id="board"></div>
</div>
<audio id="audio"></audio>
<script src="/js/app.js"></script><script src="/js/audio-engine.js"></script>
<script>
const engine=new AudioEngine($("#audio"));
async function load(){
  const fx=await api("/api/effects").catch(()=>[]);
  $("#board").innerHTML=fx.map(f=>`<div class="fx" data-id="${f.effect_id}" data-name="${f.name}"><div class="e">${f.icon||"😂"}</div><div>${f.name}</div></div>`).join("");
  $$(".fx").forEach(el=>el.onclick=()=>{
    engine.ensure(); engine.playSynth(el.dataset.name); toast(el.dataset.name+"!");
    api("/api/effects/"+el.dataset.id+"/use",{method:"POST",body:{session_id:sessionId}}).catch(()=>{});
  });
}
load();
</script></body></html>
