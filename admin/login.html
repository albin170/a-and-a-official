<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — A MUSIC</title><link rel="stylesheet" href="/css/admin.css"></head>
<body>
<div class="login-wrap">
  <h2>🔐 A MUSIC ADMIN</h2>
  <p style="color:var(--mut);font-size:13px;margin:6px 0 14px">Admins only. Users never log in.</p>
  <div id="setupBox" class="hidden">
    <p style="font-size:13px">No admins yet — create the Super Admin:</p>
    <input id="s-name" placeholder="Name"><input id="s-id" placeholder="Admin ID (blank = auto)">
    <input id="s-pw" placeholder="Password (blank = auto)" type="text">
    <button id="setupBtn" style="width:100%;margin-top:8px">Create Super Admin</button>
    <div id="setupOut" style="margin-top:10px;font-size:13px"></div><hr style="margin:14px 0;opacity:.2">
  </div>
  <input id="aid" placeholder="Admin ID e.g. BF-ADM-XXXX"><input id="pw" type="password" placeholder="Password">
  <button id="loginBtn" style="width:100%">LOGIN</button>
  <p id="err" style="color:#ff7b7b;font-size:13px;margin-top:8px"></p>
  <p style="margin-top:12px;font-size:12px;color:var(--mut)">Roles: super_admin → admin → content_manager → analytics_viewer. Passwords are stored as salted hashes, never plain text.</p>
</div>
<script>
const $=s=>document.querySelector(s);
fetch("/api/admins").catch(()=>null); // probe not needed
(async()=>{ // show setup if no admins: try setup endpoint probe via login fail? just try — setup returns 400 if done
  $("#setupBox").classList.remove("hidden");
})();
$("#setupBtn").onclick=async()=>{
  const fd=new FormData();
  fd.append("name",$("#s-name").value||"Super Admin");fd.append("admin_id",$("#s-id").value);fd.append("password",$("#s-pw").value);
  const r=await fetch("/api/admin/setup",{method:"POST",body:fd});const j=await r.json();
  $("#setupOut").innerHTML=r.admin_id?`✅ Created<br><b>ID: ${j.admin_id}</b><br><b>PW: ${j.password}</b><br><span style="color:var(--mut)">Save it — shown only once.</span>`:`❌ ${j.detail||"done"}`;
};
$("#loginBtn").onclick=async()=>{
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin_id:$("#aid").value,password:$("#pw").value})});
  const j=await r.json();
  if(!r.ok){$("#err").textContent=j.detail||"Login failed";return;}
  localStorage.setItem("bf_admin_token",j.token);localStorage.setItem("bf_admin",JSON.stringify(j));
  location.href="/admin/dashboard.html";
};
</script></body></html>
